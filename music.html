<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <link rel="stylesheet" href="music.css">
    <link rel="icon" href="public/favicon.svg">

</head>

<body>
    <header>
        <button id="svgs"><img src="https://unpkg.com/feather-icons/dist/icons/arrow-down.svg"></button>
        <h1 class="animation-text">PLAY-AREA</h1>
    </header>
    <section id="sec">
        <aside class="list">
            <div class="aside">
                <h1
                    style="padding: 1px 10px; text-align:center ; font-size: 2rem; text-decoration: underline; color: aliceblue;">
                    Music List</h1>
                <div class="music">
                    <ul></ul>
                </div>
            </div>
        </aside>
        <aside class="images">
            <div >
              
                <h1> PLAYZONE</h1>
            </div>
            <div class="haseena">
                <div class="image-container">
                    <img src="public/img/angreji-beat.jpg" alt="Song Cover" id="song-cover">
                </div>
            </div>

            </div>
        </aside>
    </section>
    <div class="listcontain">
        <div class="controls">
            <button class="prev-btn"><img src="/public/previous.svg" alt=""></button>
            <button class="play-btn"><img src="/public/pause.svg" alt=""></button>
            <button class="next-btn"><img src="public/next.svg" alt=""></button>
        </div>
        <div class="song-info">
            <h3 class="songname">Song Name</h3>
        </div>

        <div class="seekbar-container">
            <input type="range" min="0" max="100" value="0" class="seek-bar">
            <span class="time-display">0:00 / 0:00</span>
        </div>
    </div>
</body>
<script src="music.js"></script>

</html>
